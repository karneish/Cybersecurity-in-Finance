# CyberRisk Quantifier — supervisord (unified Render backend).
# Each microservice runs on its fixed localhost port; nginx is the public edge.
# Children inherit the container environment (DATABASE_URL, REDIS_URL, JWT_*,
# CORS_ORIGINS, service-to-service URLs, ...) passed by the Render service.

[supervisord]
nodaemon = true
logfile = /dev/stdout
logfile_maxbytes = 0
pidfile = /var/run/supervisord.pid
childlogdir = /var/log/cyberrisk

[inet_http_server]
port = 127.0.0.1:9001
username = local
password = supervisord-local

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:auth-service]
command = /usr/local/bin/uvicorn app.main:app --host 0.0.0.0 --port 8081 --app-dir /repo/services/auth-service
directory = /repo/services/auth-service
priority = 100
autostart = true
autorestart = true
startsecs = 3
startretries = 20
stopwaitsecs = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:asset-service]
command = /usr/local/bin/uvicorn app.main:app --host 0.0.0.0 --port 8082 --app-dir /repo/services/asset-service
directory = /repo/services/asset-service
