# ─── Public edge: gateway first, then nginx so health checks never 502 ───
# The gateway binds an internal-only port (18080): nginx owns the public
# platform port ($PORT) and forwards to it, so the two never collide.
[program:api-gateway]
command = /usr/local/bin/uvicorn app.main:app --host 0.0.0.0 --port 18080 --app-dir /repo/services/api-gateway
directory = /repo/services/api-gateway
priority = 200
autostart = true
autorestart = true
startsecs = 3
startretries = 20
stopwaitsecs = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
priority = 210
autostart = true
autorestart = true
startsecs = 3
startretries = 20
stopwaitsecs = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true