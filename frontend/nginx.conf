server {
    listen 3000;
    server_name localhost;
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ── request hardening ──────────────────────────────────────────
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # ── security headers (inherit to locations without their own add_header) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "0" always;

    # ── compression ─────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;

    # ── SPA ─────────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }

    # Never cache index.html (SPA shell referencing hashed build assets).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    # ── long-cache hashed build assets (Vite emits content-hashed names) ──
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # ── API reverse proxy (gateway enforces auth/rate limits) ────────
    location /api/ {
        set $api_upstream http://api-gateway:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket bridge to notification service ─────────────────────
    # The STOMP broker lives at exactly /ws; map /ws and /ws/ clients onto
    # that path so the proxy never forwards a mismatch of trailing slash.
    location = /ws {
        set $ws_upstream http://notification-service:8086;
        proxy_pass $ws_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /ws/ {
        set $ws_upstream http://notification-service:8086;
        proxy_pass $ws_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}