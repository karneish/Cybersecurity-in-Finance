# ────────────────────────────────────────────────────────────────────────────
# CyberRisk Quantifier — Render Blueprint (native Python, no Docker).
#
# ONE web service runs the entire backend (api-gateway + 9 microservices) and
# exposes exactly one public HTTPS URL, so the Vercel-hosted frontend only needs
# two environment variables:
#
#   VITE_API_BASE_URL = https://cyberrisk-backend.onrender.com/api
#   VITE_WS_URL       = wss://cyberrisk-backend.onrender.com/ws
#
#   https://<host>/api/*   → edge proxy → api-gateway    (JWT/rate-limit/routing)
#   https://<host>/ws      → edge proxy → notification   (STOMP 1.2 WebSocket)
#   https://<host>/health  → edge proxy → api-gateway    (Render health check)
#
# How it runs without Docker:
#   buildCommand  pip installs the dependency union in requirements.txt and the
#                 local `cybercommon` package from ./services/common. No apt-get:
#                 Render native runtimes have a read-only /var/lib/apt.
#   startCommand  deploy/render/start.sh — normalises DATABASE_URL for TLS,
#                 waits for PostgreSQL and Redis, runs migrations + seed, then
#                 execs supervisord, which starts the backend: all ten services
#                 plus the public edge proxy, in one process on $PORT.
#
# No `databases:` block on purpose. Render's free Postgres expires 30 days after
# creation and cannot be downgraded afterwards, which would take the demo offline
# mid-event. DATABASE_URL is prompted for instead — paste the Neon connection
# string there (free tier, no expiry).
#
# Deploy:
#   Render Dashboard → "New +" → "Blueprint" → select this repository.
#
# On the first sync Render prompts you for two values:
#   - CORS_ORIGINS  → your Vercel origin, as a JSON array string, e.g.
#                     '["https://cyberrisk.vercel.app"]'
#                     (a comma-separated list also works — the gateway parses
#                     both — but never leave it empty)
#   - OPENAI_API_KEY → optional; leave empty to keep the offline mock LLM.
#
# Sizing: the whole backend is ONE Python process (deploy/render/serve_all.py)
# rather than ten, because ten separate processes each load their own copy of
# numpy/pandas/scipy/scikit-learn/xgboost/ortools and measured ~1.0-1.4 GB —
# far past any plan Render offers cheaply. Consolidated, it measures ~231 MB,
# which fits the Free plan's 512 MB with room to spare.
#
# Keeping it warm costs 744 of the 750 free instance-hours a month (a full month
# of uptime). To stop Render sleeping it after 15 idle minutes — which would
# show judges a 30-60s loading page — point a free UptimeRobot monitor at
# https://<host>/health on a 5-minute interval. Do NOT create a second free web
# service in this workspace: the hours are shared, and two always-on services
# need ~1,488 hrs, which overruns the budget and gets everything suspended for
# the rest of the month.
# ────────────────────────────────────────────────────────────────────────────

databases: []  # Intentionally empty — Neon supplies the database (see header).

services:
  # Redis-compatible Key Value store (rate limits, circuit breaker, pub/sub).
  # `free` is 25 MB / 50 connections — ample for rate-limit counters, breaker
  # flags and a small pub/sub backlog, none of which hold real data.
  # ipAllowList is REQUIRED for Key Value; [] means internal-network only, which
  # is what we want since only this web service connects.
  - type: keyvalue
    name: cyberrisk-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # The whole backend, one process, one public URL.
  - type: web
    name: cyberrisk-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: .

    # One Python process: the ten services plus the public edge proxy on $PORT.
    # No apt-get: Render's *native* runtime has a read-only /var/lib/apt, so
    # `apt-get install nginx` fails the build with "Acquire (30: Read-only file
    # system". The public edge is deploy/render/edge_proxy.py instead, which runs
    # inside the same Python process as the services. supervisor comes from pip
    # (see requirements.txt), so nothing needs a system package.
    buildCommand: >-
      pip install --upgrade pip
      && pip install --prefer-binary -r requirements.txt
      && pip install ./services/common

    startCommand: bash deploy/render/start.sh

    healthCheckPath: /health
    autoDeployTrigger: commit

    # No maxShutdownDelaySeconds here: Render rejects that field on the Free
    # plan. The default 30s is enough, because supervisord.conf.template sets
    # stopwaitsecs = 20 for the backend program — deliberately below Render's 30s
    # budget, so supervisord always finishes (or SIGKILLs) before Render does.
    # serve_all.py turns SIGTERM into a shutdown of all ten servers.

    # STOMP broker conns, the risk-event consumer and the ingestion connector
    # runner are all in-process singletons — a second instance would silently
    # drop events and WebSocket fan-out. Never scale this service horizontally.
    # (Also: each instance burns free hours, and 750/month only covers one.)
    numInstances: 1

    envVars:
      # Pin the interpreter. Render's default was Python 3.14.3, which has no
      # wheels for pydantic-core, SQLAlchemy or psycopg2-binary, so pip fell
      # back to building them from source and the deploy failed. 3.12 has
      # wheels for every pinned package.
      - key: PYTHON_VERSION
        value: "3.12.11"

      # Managed Key Value, wired automatically by Render.
      - key: REDIS_URL
        fromService:
          name: cyberrisk-redis
          type: keyvalue
          property: connectionString
      # Neon's pooled connection string. start.sh appends sslmode=require if
      # it is missing, so paste the URL as-is.
      - key: DATABASE_URL
        sync: false

      # Secrets (prompted on first sync).
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # App behaviour — identical defaults to the local .env so deployed output
      # matches local development.
      - key: JWT_EXPIRY
        value: "3600"
      - key: JWT_REFRESH_EXPIRY
        value: "604800"
      - key: AUTH_ALLOW_REGISTER
        value: "false"
      - key: USE_MOCK_LLM
        value: "true"
      - key: LLM_MODEL
        value: "gpt-4o"

      # Keep pooled DB connections small — the eight DB-backed services share one
      # Render Postgres instance, so the total pool budget must fit its cap.
      # Default pool_size/max_overflow (10/20) would open ~240 connections.
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_PRE_PING
        value: "true"

      # Internal service wiring: all ten processes share this host, so they talk
      # over loopback. Listed here explicitly for visibility and overrides.
      - key: AUTH_SERVICE_URL
        value: "http://127.0.0.1:8081"
      - key: ASSET_SERVICE_URL
        value: "http://127.0.0.1:8082"
      - key: VULN_SERVICE_URL
        value: "http://127.0.0.1:8083"
      - key: CONTROL_SERVICE_URL
        value: "http://127.0.0.1:8084"
      - key: INGESTION_SERVICE_URL
        value: "http://127.0.0.1:8085"
      - key: NOTIFICATION_SERVICE_URL
        value: "http://127.0.0.1:8086"
      - key: RISK_ENGINE_URL
        value: "http://127.0.0.1:8090"
      - key: INVESTMENT_URL
        value: "http://127.0.0.1:8091"
      - key: AI_SERVICE_URL
        value: "http://127.0.0.1:8092"