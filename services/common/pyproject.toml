[project]
name = "cybercommon"
version = "0.1.0"
description = "CyberRisk Quantifier — Shared Python layer (DB models, JWT, auth deps, config)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0,<6",
    "redis>=5.0.0",
    "fastapi>=0.110.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"