[project]
name = "ai-service"
version = "0.1.0"
description = "CyberRisk Quantifier — AI Decision Support (Recommendations, NL Queries, Explanations)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "openai>=1.12.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "cybercommon",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
