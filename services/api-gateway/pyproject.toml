[project]
name = "api-gateway"
version = "0.1.0"
description = "CyberRisk Quantifier — FastAPI reverse proxy gateway (JWT, rate limiting, circuit breaker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "cybercommon",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"